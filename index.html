<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juice Shop POS</title>
</head>

<body>

    <header class="pos-header">
        <h1>🍹 Fresh Juice🍹</h1>
        <!-- <div class="order-info">Order #001</div> -->
    </header>
    <main class="pos-container">


        <section class="menu-section">
            <div class="category-bar">
                <button class="cat-btn active">All</button>
                <button class="cat-btn">Fresh Juices</button>
                <button class="cat-btn">Milkshakes</button>
                <button class="cat-btn">Fruit Salads</button>
            </div>

            <div class="items-grid" id="items-grid">
                <div class="item-card">
                    <img src="assets/img/Apple.png" alt="Apple Juice">
                    <h3>Apple Juice</h3>
                    <p class="price">Rs. 250.00</p>
                </div>

                <div class="item-card">
                    <img src="assets/IMG/Avocado.png" alt="Avocado Juice">
                    <h3>Avocado Juice</h3>
                    <p class="price">Rs. 300.00</p>
                </div>

                <div class="item-card">
                    <img src="assets/img/Banana.png" alt="Banana Juice">
                    <h3>Banana Juice</h3>
                    <p class="price">Rs. 250.00</p>
                </div>

                <div class="item-card">
                    <img src="assets/img/Chocolate.png" alt="Chocolate Milkshakes">
                    <h3>Chocolate Milkshakes</h3>
                    <p class="price">Rs. 350.00</p>
                </div>

                <div class="item-card">
                    <img src="assets/img/Grapes.png" alt="Grapes Juice">
                    <h3>Grapes Juice</h3>
                    <p class="price">Rs. 250.00</p>
                </div>

                <div class="item-card">
                    <img src="assets/img/Lime.png" alt="Lime Juice">
                    <h3>Lime Juice</h3>
                    <p class="price">Rs. 200.00</p>
                </div>

                <div class="item-card">
                    <img src="assets/img/Mango.png" alt="Mango Juice">
                    <h3>Mango Juice</h3>
                    <p class="price">Rs. 300.00</p>
                </div>

                <div class="item-card">
                    <img src="assets/img/Orange.png" alt="Orange Juice">
                    <h3>Orange Juice</h3>
                    <p class="price">Rs. 250.00</p>
                </div>

                <div class="item-card">
                    <img src="assets/img/Papaya.png" alt="Papaya Juice">
                    <h3>Papaya Juice</h3>
                    <p class="price">Rs. 250.00</p>
                </div>

                <div class="item-card">
                    <img src="assets/img/Pineapple.png" alt="Pineapple Juice">
                    <h3>Pineapple Juice</h3>
                    <p class="price">Rs. 250.00</p>
                </div>

            </div>
        </section>

    </main>


</body>

</html>
